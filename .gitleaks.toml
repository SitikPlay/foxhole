# Конфигурация gitleaks для Foxhole.
# Базовые правила gitleaks используются целиком; исключаем только
# Gradle-кэши и билд-артефакты: там гейтятся имена классов библиотек
# (BouncyCastle и т.п.), которые эвристика generic-api-key путает
# с секретами. Настоящих секретов в них нет — проверено (gitleaks 8.30.1).
[extend]
useDefault = true

[allowlist]
description = "Gradle build-каталоги: кэши библиотек, не секреты"
paths = [
  '''(^|/)build/''',
]
