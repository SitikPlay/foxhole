name: foxhole-adb

on:
  push:
    tags: ['adb-v*']
  pull_request:
    paths:
      - 'tools/foxhole-adb/**'
      - '.github/workflows/foxhole-adb.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Vet
        working-directory: tools/foxhole-adb
        run: go vet ./...

      - name: Test
        working-directory: tools/foxhole-adb
        run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: windows
            arch: amd64
          - os: linux
            arch: amd64
          - os: darwin
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        working-directory: tools/foxhole-adb
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          VERSION="dev"
          case "$GITHUB_REF_NAME" in
            adb-v*) VERSION="$GITHUB_REF_NAME" ;;
          esac
          out="foxhole-adb-${{ matrix.os }}-${{ matrix.arch }}"
          if [ "${{ matrix.os }}" = "windows" ]; then out="$out.exe"; fi
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "$out" .

      - name: Zip (portable)
        working-directory: tools/foxhole-adb
        run: |
          mkdir -p out
          if [ "${{ matrix.os }}" = "windows" ]; then
            mkdir -p "out/staging/platform-tools"
            cp "foxhole-adb-windows-amd64.exe" "out/staging/"
            cp platform-tools/adb.exe platform-tools/AdbWinApi.dll \
               platform-tools/AdbWinUsbApi.dll "out/staging/platform-tools/"
            (cd "out/staging" && zip -r "../foxhole-adb-windows-amd64.zip" .)
            rm -rf "out/staging"
          else
            zip -j "out/foxhole-adb-${{ matrix.os }}-${{ matrix.arch }}.zip" \
                "foxhole-adb-${{ matrix.os }}-${{ matrix.arch }}"
          fi
          cp README.md "out/README-foxhole-adb.md"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: foxhole-adb-${{ matrix.os }}-${{ matrix.arch }}
          path: tools/foxhole-adb/out/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/adb-v')
        uses: softprops/action-gh-release@v2
        with:
          files: tools/foxhole-adb/out/*
          generate_release_notes: true
