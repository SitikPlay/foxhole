name: foxhole-adb

on:
  push:
    tags: ['adb-v*']
  pull_request:
    paths:
      - 'tools/foxhole-adb/**'
      - '.github/workflows/foxhole-adb.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Vet
        working-directory: tools/foxhole-adb
        run: go vet ./...

      - name: Test
        working-directory: tools/foxhole-adb
        run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: windows
            arch: amd64
          - os: linux
            arch: amd64
          - os: darwin
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        working-directory: tools/foxhole-adb
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          VERSION="dev"
          case "$GITHUB_REF_NAME" in
            adb-v*) VERSION="$GITHUB_REF_NAME" ;;
          esac
          if [ "${{ matrix.os }}" = "windows" ]; then
            out="fx.exe"
          else
            out="foxhole-adb-${{ matrix.os }}-${{ matrix.arch }}"
          fi
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "$out" .

      - name: Zip (portable)
        working-directory: tools/foxhole-adb
        run: |
          mkdir -p out
          if [ "${{ matrix.os }}" = "windows" ]; then
            mkdir -p "out/staging/platform-tools"
            cp "fx.exe" "out/staging/"
            cp platform-tools/adb.exe platform-tools/AdbWinApi.dll \
               platform-tools/AdbWinUsbApi.dll "out/staging/platform-tools/"
            (cd "out/staging" && zip -r "../foxhole-adb-windows-amd64.zip" .)
            rm -rf "out/staging"
          else
            zip -j "out/foxhole-adb-${{ matrix.os }}-${{ matrix.arch }}.zip" \
                "foxhole-adb-${{ matrix.os }}-${{ matrix.arch }}"
          fi
          cp README.md "out/README-foxhole-adb.md"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: foxhole-adb-${{ matrix.os }}-${{ matrix.arch }}
          path: tools/foxhole-adb/out/*

      - name: Release name
        if: startsWith(github.ref, 'refs/tags/adb-v')
        id: relname
        run: echo "name=Foxhole ADB ${GITHUB_REF_NAME#adb-} — Swiss Army Knife" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/adb-v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.relname.outputs.name }}
          body: |
            Обновление Foxhole ADB — консольного компаньона для Android-приложения Foxhole.

            Отныне у всех будущих версий проекта Foxhole — как для основного Android-приложения, так и для консольного Foxhole ADB — появляется собственное кодовое имя (название версии). Этот релиз Foxhole ADB v1.2.0 открывает новую систему обозначений и получает название «Swiss Army Knife» («Швейцарский нож»), превращая утилиту в универсальный мульти-инструмент.

            Новые возможности:
            - Подключение к экрану телефона: `mirror` (интерактивная трансляция экрана и управление с ПК через scrcpy с автозагрузкой по `--fetch`), `view` (моментальный просмотр экрана в окне фото).
            - 1-Click запуск и управление сервером Foxhole: `start`, `status` (`ping`), `stop` без ручного ввода app_process.
            - Встроенный ИИ-помощник `ask`: задавайте вопросы по Foxhole и Android прямо из терминала.
            - Утилиты экрана и медиа: `photos` (быстрая выгрузка свежих фото/скриншотов), `record` (запись экрана с обратным отсчетом).
            - Работа с APK: `apk pull` (извлечение установленного APK любого приложения на ПК), `install-all` (пакетная установка всех APK из каталога).
            - Системные твики и ввод: `open` (открытие ссылок и диплинков на телефоне), `darkmode` (переключение темной темы), `stay-awake` (экран не гаснет при подключении к ПК), `volume` (управление громкостью), `wifi` (включение/отключение Wi-Fi), `search` (быстрый поиск пакетов), `clear` (сброс кэша и данных приложения), `top` (нагрузка CPU и памяти), `clip` (чтение/запись буфера обмена), `type` (быстрый ввод текста), `key` (нажатия клавиш), `anim` (управление анимациями), `dns` (AdGuard Private DNS для блокировки рекламы), `battery` (сводка и симуляция батареи), `info` (паспорт устройства).

            Платформы: Windows x64 (портативный архив с fx.exe и adb), Linux x64, macOS ARM64.
            Официальные Android Platform Tools скачиваются по команде fetch.

            Лицензия: GPL-3.0-or-later.
          files: tools/foxhole-adb/out/*
          generate_release_notes: true
